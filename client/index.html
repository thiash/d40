<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f2b22">
<title>D40</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,500;0,700;1,500&family=Cinzel:wght@700&display=swap">
<style>
  :root {
    --moss: rgba(31, 43, 34, 0.66);      /* Glas über der Welt */
    --bone: #ece3cc;                     /* Schrift */
    --bone-dim: rgba(236, 227, 204, 0.66);
    --brass: #c9a24a;                    /* Ränder, Knauf, Abklingring */
    --madder: #9c2f26;                   /* Angriff */
    --lichen: #8fc77a;                   /* verbunden */
    --amber: #e3b04b;                    /* verbindet */
    --ember: #d9583b;                    /* getrennt */
    --sans: "Alegreya Sans", "Trebuchet MS", system-ui, sans-serif;
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #a9cfe0; color: var(--bone); font-family: var(--sans);
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Statusleiste oben links */
  #status {
    position: fixed; top: calc(var(--sat) + 12px); left: calc(var(--sal) + 12px);
    display: flex; align-items: center; gap: 10px;
    padding: 6px 14px 6px 12px; border-radius: 999px;
    background: var(--moss); border: 1px solid rgba(201, 162, 74, 0.35);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    font-size: 15px; line-height: 1.2; font-weight: 500;
  }
  #status .mark { font: 700 15px/1 var(--display); letter-spacing: 0.06em; color: var(--brass); }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex: none; }
  #status[data-state="online"] .dot { background: var(--lichen); }
  #status[data-state="offline"] .dot { background: var(--ember); }
  #status[data-state="connecting"] .dot { animation: pulse 1s ease-in-out infinite; }
  #status .ping { color: var(--bone-dim); font-size: 13px; }
  #status .ping:empty { display: none; }
  @keyframes pulse { 50% { opacity: 0.25; } }

  /* Chronik: kurze Meldungen unter der Statusleiste */
  #log {
    position: fixed; top: calc(var(--sat) + 56px); left: calc(var(--sal) + 16px);
    max-width: min(78vw, 360px); pointer-events: none;
    display: flex; flex-direction: column; gap: 4px;
  }
  #log .line {
    font-style: italic; font-size: 15px; line-height: 1.35;
    text-shadow: 0 1px 2px rgba(20, 28, 22, 0.9), 0 0 12px rgba(20, 28, 22, 0.55);
    transition: opacity 0.6s;
  }
  #log .line.out { opacity: 0; }

  /* Joystick, nur auf Touch-Geräten sichtbar */
  #stick {
    position: fixed; width: 124px; height: 124px; margin: -62px 0 0 -62px;
    left: calc(var(--sal) + 96px); top: calc(100% - var(--sab) - 112px);
    border-radius: 50%; border: 1.5px solid rgba(201, 162, 74, 0.55);
    background: radial-gradient(circle, rgba(31, 43, 34, 0.15) 40%, rgba(31, 43, 34, 0.45));
    opacity: 0.45; pointer-events: none; display: none;
    transition: opacity 0.25s;
  }
  body.touch #stick { display: block; }
  #stick.active { opacity: 1; transition: none; }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%; border: 1px solid rgba(80, 60, 20, 0.6);
    background: radial-gradient(circle at 36% 30%, #f3e2b3, var(--brass) 62%, #8a6a2a);
    box-shadow: 0 4px 10px rgba(20, 28, 22, 0.45);
  }

  /* Angriff: ein Siegel aus Krapprot und Messing */
  #attack {
    position: fixed; right: calc(var(--sar) + 26px); bottom: calc(var(--sab) + 30px);
    width: 92px; height: 92px; padding: 0; border-radius: 50%;
    border: 3px solid var(--brass); color: #f6e7c4; cursor: pointer;
    background:
      radial-gradient(circle, transparent 58%, rgba(0, 0, 0, 0.2) 60%, transparent 63%),
      radial-gradient(circle at 34% 28%, #c8493d, var(--madder) 58%, #6e1f19);
    box-shadow: 0 6px 16px rgba(20, 28, 22, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.16),
                inset 0 -3px 6px rgba(0, 0, 0, 0.3);
    display: grid; place-items: center; touch-action: none; font-family: var(--sans);
  }
  #attack .icon { width: 34px; height: 34px; margin-top: -12px; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.35)); }
  #attack .label {
    position: absolute; bottom: 15px; left: 0; right: 0; text-align: center;
    font-size: 13px; font-weight: 700; letter-spacing: 0.02em;
  }
  #attack .ring {
    position: absolute; inset: -9px; width: calc(100% + 18px); height: calc(100% + 18px);
    transform: rotate(-90deg); pointer-events: none;
  }
  #attack .ring circle {
    fill: none; stroke: var(--brass); stroke-width: 3.5; stroke-linecap: round;
    stroke-dasharray: 289; stroke-dashoffset: 289; opacity: 0;
  }
  #attack.cool { animation: press 0.2s ease-out; }
  #attack.cool .ring circle { animation: cool 0.45s linear forwards; }
  #attack:focus-visible { outline: 3px solid var(--bone); outline-offset: 6px; }
  @keyframes press { 40% { transform: scale(0.9); } }
  @keyframes cool {
    0% { stroke-dashoffset: 289; opacity: 1; }
    92% { stroke-dashoffset: 0; opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }

  /* Tastatur-Hinweis am PC */
  #hint {
    position: fixed; left: 50%; bottom: calc(var(--sab) + 18px); transform: translateX(-50%);
    display: flex; gap: 20px; padding: 8px 18px; border-radius: 999px;
    background: var(--moss); font-size: 14px; color: var(--bone-dim); white-space: nowrap;
  }
  #hint kbd {
    font: 700 13px/1 var(--sans); color: var(--bone);
    border: 1px solid rgba(236, 227, 204, 0.35); border-bottom-width: 2px; border-radius: 5px;
    padding: 3px 6px; margin-right: 6px;
  }
  body.touch #hint { display: none; }
  @media (max-width: 760px) { #hint { display: none; } }

  @media (prefers-reduced-motion: reduce) {
    #log .line { transition: none; }
    #attack.cool { animation: none; }
    #status[data-state="connecting"] .dot { animation: none; }
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="status" data-state="connecting" role="status" aria-live="polite">
    <span class="mark">D40</span>
    <span class="dot" aria-hidden="true"></span>
    <span id="status-text">Starte…</span>
    <span id="ping" class="ping"></span>
  </div>
  <div id="log" aria-live="polite"></div>

  <div id="stick" aria-hidden="true"><div id="knob"></div></div>

  <button id="attack" type="button" aria-label="Angreifen (Leertaste)">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46"/></svg>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 16 L19.5 4.5"/>
      <path d="M5.5 13.5 L10.5 18.5"/>
      <path d="M8 16 L4.5 19.5"/>
    </svg>
    <span class="label">Angreifen</span>
  </button>

  <div id="hint">
    <span><kbd>WASD</kbd>laufen</span>
    <span><kbd>Leertaste</kbd>angreifen</span>
    <span>Mit der Maus ziehen: Kamera drehen</span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
'use strict';
// ===========================================================================
//  D40 – Client, Schritt 1: Welt, Steuerung und Verbindung zum Server
// ===========================================================================

// ---- Regeln (der Server schickt beim Verbinden seine eigenen Werte) ----
const RULES = { speed: 6, worldHalf: 95 };
const WATER_LEVEL = -3.2;
const SEND_RATE = 15;               // Bewegungs-Updates pro Sekunde an den Server
const ATTACK_COOLDOWN_MS = 450;
const ARM_REST = 0.9;               // Ruhehaltung des Schwertarms (Radiant)

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const r2 = (v) => Math.round(v * 100) / 100;
const damp = (rate, dt) => 1 - Math.exp(-rate * dt);   // Glätten, unabhängig von der Bildrate
function lerpAngle(a, b, t) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

// ---- Oberfläche ----
const ui = {
  status: document.getElementById('status'),
  statusText: document.getElementById('status-text'),
  ping: document.getElementById('ping'),
  log: document.getElementById('log'),
  stick: document.getElementById('stick'),
  knob: document.getElementById('knob'),
  attack: document.getElementById('attack'),
};
if (window.matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');

function setStatus(state, text, ping = '') {
  ui.status.dataset.state = state;
  ui.statusText.textContent = text;
  ui.ping.textContent = ping;
}

function log(text) {
  const line = document.createElement('div');
  line.className = 'line';
  line.textContent = text;
  ui.log.appendChild(line);
  while (ui.log.children.length > 4) ui.log.firstChild.remove();
  setTimeout(() => line.classList.add('out'), 4500);
  setTimeout(() => line.remove(), 5200);
}

if (typeof THREE === 'undefined') {
  setStatus('offline', 'Three.js nicht geladen. Internetverbindung prüfen.');
  throw new Error('Three.js fehlt');
}

// ---- Renderer, Szene, Licht ----
const canvas = document.getElementById('game');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  setStatus('offline', 'Dieses Gerät unterstützt kein WebGL.');
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

const scene = new THREE.Scene();
const SKY = 0xa9cfe0;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 45, 140);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 300);

// Keine Echtzeitschatten: Himmels- und Sonnenlicht reichen für den Low-Poly-Look
scene.add(new THREE.HemisphereLight(0xfff1d6, 0x4b5d33, 0.95));
const sun = new THREE.DirectionalLight(0xfff6e5, 0.75);
sun.position.set(40, 60, 25);
scene.add(sun);

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ===========================================================================
//  Welt – deterministisch erzeugt, damit alle Spieler dieselbe Welt sehen
// ===========================================================================
function mulberry32(seed) {
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(4040);

function heightAt(x, z) {
  return Math.sin(x * 0.045) * 2.2 + Math.cos(z * 0.05) * 1.8
       + Math.sin((x + z) * 0.11) * 0.7 + Math.cos((x - z) * 0.07) * 0.9 - 0.8;
}
// Im Wasser treibt man an der Oberfläche – ein Vorgeschmack aufs Schwimmen
const groundY = (x, z) => Math.max(heightAt(x, z), WATER_LEVEL - 1.1);

function flat(geo) {                // Low-Poly-Look: jede Fläche bekommt ihre eigene Normale
  const g = geo.index ? geo.toNonIndexed() : geo;
  g.computeVertexNormals();
  return g;
}

function buildTerrain() {
  const geo = new THREE.PlaneGeometry(220, 220, 88, 88);
  geo.rotateX(-Math.PI / 2);
  const p0 = geo.attributes.position;
  for (let i = 0; i < p0.count; i++) p0.setY(i, heightAt(p0.getX(i), p0.getZ(i)));

  const g = flat(geo);
  const pos = g.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i += 3) {
    const y = (pos.getY(i) + pos.getY(i + 1) + pos.getY(i + 2)) / 3;
    const v = rand() * 0.05;
    let c;
    if (y < WATER_LEVEL + 0.5) c = [0.74 + v, 0.66 + v, 0.46 + v];      // Ufer
    else if (y > 3.2)          c = [0.52 + v, 0.6 + v, 0.31 + v];       // trockene Kuppen
    else                       c = [0.31 + v, 0.52 + v, 0.24 + v];      // Wiese
    for (let k = 0; k < 3; k++) colors.set(c, (i + k) * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true })));

  const water = new THREE.Mesh(
    new THREE.PlaneGeometry(220, 220),
    new THREE.MeshLambertMaterial({ color: 0x3f8fb5, transparent: true, opacity: 0.75 })
  );
  water.rotation.x = -Math.PI / 2;
  water.position.y = WATER_LEVEL;
  scene.add(water);
}

// Bäume und Felsen als Instanzen: ein Draw-Call pro Sorte, egal wie viele
function buildNature() {
  const geos = {
    trunk: flat(new THREE.CylinderGeometry(0.16, 0.24, 1.4, 5).translate(0, 0.7, 0)),
    pine:  flat(new THREE.ConeGeometry(1.15, 2.8, 6).translate(0, 2.6, 0)),
    crown: flat(new THREE.IcosahedronGeometry(1.25, 0).translate(0, 2.5, 0)),
    rock:  flat(new THREE.DodecahedronGeometry(0.7, 0)),
  };
  const mats = {
    trunk: new THREE.MeshLambertMaterial({ color: 0x6b4a2f }),
    pine:  new THREE.MeshLambertMaterial({ color: 0x2f5d3a }),
    crown: new THREE.MeshLambertMaterial({ color: 0x4f8a3c }),
    rock:  new THREE.MeshLambertMaterial({ color: 0x8a8f8c }),
  };
  const lists = { pine: [], crown: [], rock: [] };
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();
  const s = new THREE.Vector3(), p = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);

  for (let i = 0; i < 260; i++) {
    const x = (rand() * 2 - 1) * 108;
    const z = (rand() * 2 - 1) * 108;
    const kind = rand() < 0.22 ? 'rock' : rand() < 0.65 ? 'pine' : 'crown';
    const k = 0.7 + rand() * 0.7;
    const turn = rand() * Math.PI * 2;
    const y = heightAt(x, z);
    if (Math.hypot(x, z) < 14 || y < WATER_LEVEL + 0.6) continue;  // Lichtung am Start, nichts im Wasser
    q.setFromAxisAngle(up, turn);
    s.set(k, kind === 'rock' ? k * 0.7 : k, k);
    m.compose(p.set(x, y - 0.1, z), q, s);
    lists[kind].push(m.clone());
  }

  const add = (geo, mat, list) => {
    const mesh = new THREE.InstancedMesh(geo, mat, list.length);
    list.forEach((mx, i) => mesh.setMatrixAt(i, mx));
    mesh.instanceMatrix.needsUpdate = true;
    mesh.frustumCulled = false;     // in dieser Three.js-Version nötig, sonst verschwinden Instanzen
    scene.add(mesh);
  };
  add(geos.trunk, mats.trunk, lists.pine.concat(lists.crown));
  add(geos.pine, mats.pine, lists.pine);
  add(geos.crown, mats.crown, lists.crown);
  add(geos.rock, mats.rock, lists.rock);
}

buildTerrain();
buildNature();

// ===========================================================================
//  Figuren – Low-Poly-Platzhalter, später ersetzt durch echte Modelle mit Rig
// ===========================================================================
const PARTS = {
  leg:   flat(new THREE.CylinderGeometry(0.12, 0.1, 0.8, 5).translate(0, -0.4, 0)),
  torso: flat(new THREE.CylinderGeometry(0.32, 0.42, 0.85, 6)),
  head:  flat(new THREE.IcosahedronGeometry(0.27, 0)),
  pack:  flat(new THREE.BoxGeometry(0.46, 0.52, 0.24)),      // der Rucksack – unser Inventar
  armL:  flat(new THREE.CylinderGeometry(0.08, 0.07, 0.6, 5).translate(0, -0.3, 0)),
  armR:  flat(new THREE.CylinderGeometry(0.08, 0.07, 0.55, 5).rotateX(Math.PI / 2).translate(0, 0, 0.27)),
  guard: flat(new THREE.BoxGeometry(0.3, 0.06, 0.06).translate(0, 0, 0.6)),
  blade: flat(new THREE.BoxGeometry(0.07, 0.04, 0.95).translate(0, 0, 1.1)),
};
const MATS = {
  skin:    new THREE.MeshLambertMaterial({ color: 0xe0b48e }),
  cloth:   new THREE.MeshLambertMaterial({ color: 0x3b2f27 }),
  leather: new THREE.MeshLambertMaterial({ color: 0x7a5534 }),
  steel:   new THREE.MeshLambertMaterial({ color: 0xc9cfd4 }),
};

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawTag(sprite) {
  const text = sprite.userData.text;
  const cv = sprite.material.map.image;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.font = '700 28px "Alegreya Sans", "Trebuchet MS", sans-serif';
  const w = Math.min(248, ctx.measureText(text).width + 34);
  ctx.fillStyle = 'rgba(31, 43, 34, 0.72)';
  roundRectPath(ctx, 128 - w / 2, 13, w, 38, 19);
  ctx.fill();
  ctx.fillStyle = '#ece3cc';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 33);
  sprite.material.map.needsUpdate = true;
}

function makeNameTag(text) {
  const cv = document.createElement('canvas');
  cv.width = 256;
  cv.height = 64;
  const material = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthWrite: false });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(2.4, 0.6, 1);
  sprite.position.y = 2.6;
  sprite.userData.text = text;
  drawTag(sprite);
  return sprite;
}

function makeCharacter(color, name) {
  const root = new THREE.Group();
  const body = new THREE.Group();   // alles außer dem Namensschild – wippt beim Laufen
  root.add(body);
  const tunic = new THREE.MeshLambertMaterial({ color });

  const mesh = (geo, mat, x = 0, y = 0, z = 0) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    return m;
  };
  const joint = (x, y, z, ...children) => {
    const g = new THREE.Group();
    g.position.set(x, y, z);
    g.add(...children);
    body.add(g);
    return g;
  };

  const legL = joint(-0.17, 0.8, 0, mesh(PARTS.leg, MATS.cloth));
  const legR = joint(0.17, 0.8, 0, mesh(PARTS.leg, MATS.cloth));
  body.add(mesh(PARTS.torso, tunic, 0, 1.22, 0));
  body.add(mesh(PARTS.head, MATS.skin, 0, 1.88, 0));
  body.add(mesh(PARTS.pack, MATS.leather, 0, 1.28, -0.36));
  const armL = joint(-0.42, 1.5, 0, mesh(PARTS.armL, MATS.skin));
  const armR = joint(0.42, 1.5, 0.04,
    mesh(PARTS.armR, MATS.skin), mesh(PARTS.guard, MATS.cloth), mesh(PARTS.blade, MATS.steel));
  armR.rotation.x = ARM_REST;

  const tag = makeNameTag(name);
  root.add(tag);
  root.userData = { body, legL, legR, armL, armR, tunic, tag, walk: 0, amp: 0, swing: -1 };
  scene.add(root);
  return root;
}

function disposeCharacter(root) {
  scene.remove(root);
  const u = root.userData;
  u.tunic.dispose();
  u.tag.material.map.dispose();
  u.tag.material.dispose();
}

function swingAngle(p) {            // ausholen, zuschlagen, zurück in die Ruhehaltung
  if (p < 0) return ARM_REST;
  if (p < 0.3) return lerp(ARM_REST, -1.3, smooth(p / 0.3));
  if (p < 0.55) return lerp(-1.3, 1.25, smooth((p - 0.3) / 0.25));
  return lerp(1.25, ARM_REST, smooth((p - 0.55) / 0.45));
}

function animateCharacter(model, x, z, ry, speed, dt) {
  const u = model.userData;
  model.position.set(x, groundY(x, z), z);
  model.rotation.y = lerpAngle(model.rotation.y, ry, damp(14, dt));

  // Laufen: Beine und linker Arm schwingen, der Körper wippt
  const target = speed > 0.3 ? Math.min(speed / RULES.speed, 1) : 0;
  u.amp = lerp(u.amp, target, damp(10, dt));
  if (target > 0) u.walk += dt * (5 + speed * 1.4);
  const s = Math.sin(u.walk);
  u.legL.rotation.x = s * 0.7 * u.amp;
  u.legR.rotation.x = -s * 0.7 * u.amp;
  u.armL.rotation.x = -s * 0.5 * u.amp;
  u.body.position.y = Math.abs(s) * 0.08 * u.amp;

  if (u.swing >= 0) {
    u.swing += dt / 0.4;
    if (u.swing >= 1) u.swing = -1;
  }
  u.armR.rotation.x = swingAngle(u.swing);
}

// ===========================================================================
//  Spielzustand
// ===========================================================================
const me = { id: null, x: 0, z: 0, ry: 0, model: null };
const others = new Map();           // id → { name, model, x, z, tx, tz, ry }

let camYaw = 0, camPitch = 0.42, camDist = 9;
const camTarget = new THREE.Vector3();
const tmpV = new THREE.Vector3();

function setMe(name, color) {
  if (me.model) disposeCharacter(me.model);
  me.model = makeCharacter(color, name);
  me.model.position.set(me.x, groundY(me.x, me.z), me.z);
  me.model.rotation.y = me.ry;
  camTarget.set(me.x, groundY(me.x, me.z) + 1.5, me.z);
}

function addOther(p) {
  if (p.id === me.id || others.has(p.id)) return;
  const model = makeCharacter(p.color, p.name);
  model.position.set(p.x, groundY(p.x, p.z), p.z);
  model.rotation.y = p.ry;
  others.set(p.id, { name: p.name, model, x: p.x, z: p.z, tx: p.x, tz: p.z, ry: p.ry });
}

function removeOther(id) {
  const o = others.get(id);
  if (!o) return;
  disposeCharacter(o.model);
  others.delete(id);
}

function clearOthers() {
  [...others.keys()].forEach(removeOther);
}

// Namensschilder neu zeichnen, sobald die Schrift geladen ist
if (document.fonts && document.fonts.load) {
  document.fonts.load('700 28px "Alegreya Sans"').then(() => {
    [me.model, ...[...others.values()].map((o) => o.model)]
      .filter(Boolean)
      .forEach((model) => drawTag(model.userData.tag));
  }).catch(() => {});
}

// ===========================================================================
//  Steuerung: Joystick links, Kamera rechts wischen, Tastatur und Maus am PC
// ===========================================================================
const input = { x: 0, y: 0 };       // Joystick: x = rechts, y = vorwärts (je -1 bis 1)
const keys = new Set();
const STICK_RADIUS = 52;
const pointer = { stick: null, stickX: 0, stickY: 0, cam: null, camX: 0, camY: 0 };

function moveStick(x, y) {
  let dx = x - pointer.stickX, dy = y - pointer.stickY;
  const d = Math.hypot(dx, dy);
  if (d > STICK_RADIUS) { dx *= STICK_RADIUS / d; dy *= STICK_RADIUS / d; }
  ui.knob.style.transform = `translate(${dx}px, ${dy}px)`;
  const ix = dx / STICK_RADIUS, iy = -dy / STICK_RADIUS;
  const inDeadzone = Math.hypot(ix, iy) < 0.15;
  input.x = inDeadzone ? 0 : ix;
  input.y = inDeadzone ? 0 : iy;
}

canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') document.body.classList.add('touch');
  const touchLike = e.pointerType !== 'mouse';
  if (touchLike && pointer.stick === null && e.clientX < window.innerWidth / 2) {
    pointer.stick = e.pointerId;    // Joystick erscheint dort, wo der Daumen landet
    pointer.stickX = e.clientX;
    pointer.stickY = e.clientY;
    ui.stick.classList.add('active');
    ui.stick.style.left = e.clientX + 'px';
    ui.stick.style.top = e.clientY + 'px';
    moveStick(e.clientX, e.clientY);
  } else if (pointer.cam === null) {
    pointer.cam = e.pointerId;
    pointer.camX = e.clientX;
    pointer.camY = e.clientY;
  } else {
    return;
  }
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId === pointer.stick) {
    moveStick(e.clientX, e.clientY);
  } else if (e.pointerId === pointer.cam) {
    camYaw -= (e.clientX - pointer.camX) * 0.006;
    camPitch = clamp(camPitch + (e.clientY - pointer.camY) * 0.004, 0.12, 1.15);
    pointer.camX = e.clientX;
    pointer.camY = e.clientY;
  }
});

function endPointer(e) {
  if (e.pointerId === pointer.stick) {
    pointer.stick = null;
    input.x = input.y = 0;
    ui.stick.classList.remove('active');
    ui.stick.style.left = ui.stick.style.top = '';
    ui.knob.style.transform = '';
  }
  if (e.pointerId === pointer.cam) pointer.cam = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  camDist = clamp(camDist + e.deltaY * 0.01, 5, 16);
}, { passive: false });

window.addEventListener('keydown', (e) => {
  keys.add(e.code);
  if (e.code === 'Space') {
    e.preventDefault();
    if (!e.repeat) attack();
  }
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

let lastAttack = -Infinity;
function attack() {
  const now = performance.now();
  if (now - lastAttack < ATTACK_COOLDOWN_MS) return;
  lastAttack = now;
  me.model.userData.swing = 0;
  ui.attack.classList.remove('cool');
  void ui.attack.offsetWidth;       // Animation neu starten
  ui.attack.classList.add('cool');
  sendMsg({ t: 'attack' });
}
ui.attack.addEventListener('pointerdown', (e) => { e.preventDefault(); attack(); });
ui.attack.addEventListener('click', (e) => { if (e.detail === 0) attack(); });  // Enter-Taste

// ===========================================================================
//  Netzwerk – WebSocket zum Spielserver
// ===========================================================================
const net = {
  ws: null, retry: 0, corr: 0, ping: null,
  sendTimer: 0, pingTimer: 0,
  sent: { x: Infinity, z: Infinity, ry: Infinity },
};

const isOnline = () => net.ws !== null && net.ws.readyState === WebSocket.OPEN && me.id !== null;

function sendMsg(msg) {
  if (net.ws && net.ws.readyState === WebSocket.OPEN) net.ws.send(JSON.stringify(msg));
}

function connect() {
  if (!/^https?:$/.test(location.protocol)) {
    setStatus('offline', 'Offline');
    log('Datei direkt geöffnet: Du spielst allein. Für Mehrspieler den Server mit npm start starten.');
    return;
  }
  setStatus('connecting', 'Verbinde…');
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  net.ws = ws;

  ws.addEventListener('open', () => { net.retry = 0; });
  ws.addEventListener('message', (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    onMessage(msg);
  });
  ws.addEventListener('close', () => {
    if (net.ws !== ws) return;
    const wasOnline = me.id !== null;
    net.ws = null;
    me.id = null;
    net.ping = null;
    clearOthers();
    const wait = Math.min(1000 * 2 ** net.retry, 10000);
    net.retry++;
    setStatus('offline', `Getrennt, neuer Versuch in ${Math.round(wait / 1000)} s`);
    if (wasOnline) log('Verbindung zum Server verloren.');
    else if (net.retry === 1) log('Kein Server erreichbar. Starte ihn mit npm start.');
    setTimeout(connect, wait);
  });
}

function onMessage(msg) {
  switch (msg.t) {
    case 'welcome': {
      Object.assign(RULES, msg.rules);
      const you = msg.you;
      me.id = you.id;
      me.x = you.x;
      me.z = you.z;
      me.ry = you.ry;
      net.corr = 0;
      net.sent = { x: Infinity, z: Infinity, ry: Infinity };
      setMe(you.name, you.color);
      clearOthers();
      msg.players.forEach(addOther);
      log(`Willkommen, ${you.name}.`);
      break;
    }
    case 'join':
      addOther(msg.player);
      log(`${msg.player.name} ist da.`);
      break;
    case 'leave': {
      const o = others.get(msg.id);
      if (o) {
        log(`${o.name} ist gegangen.`);
        removeOther(msg.id);
      }
      break;
    }
    case 'state':
      for (const [id, x, z, ry] of msg.p) {
        const o = others.get(id);
        if (o) { o.tx = x; o.tz = z; o.ry = ry; }
      }
      break;
    case 'attack': {
      const o = others.get(msg.id);
      if (o) o.model.userData.swing = 0;
      break;
    }
    case 'correct':                 // Server hat eine Bewegung abgelehnt: zurück auf seine Position
      me.x = msg.x;
      me.z = msg.z;
      net.corr = msg.n;
      break;
    case 'pong':
      net.ping = Math.round(performance.now() - msg.ts);
      break;
  }
  if (isOnline()) {
    setStatus('online', `${others.size + 1} Spieler online`, net.ping === null ? '' : `${net.ping} ms`);
  }
}

function updateNet(dt) {
  if (!isOnline()) return;
  net.sendTimer += dt;
  net.pingTimer += dt;
  if (net.sendTimer >= 1 / SEND_RATE) {
    net.sendTimer = 0;
    const s = net.sent;
    if (Math.abs(me.x - s.x) > 0.01 || Math.abs(me.z - s.z) > 0.01 || Math.abs(me.ry - s.ry) > 0.02) {
      sendMsg({ t: 'move', x: r2(me.x), z: r2(me.z), ry: r2(me.ry), c: net.corr });
      net.sent = { x: me.x, z: me.z, ry: me.ry };
    }
  }
  if (net.pingTimer >= 2) {
    net.pingTimer = 0;
    sendMsg({ t: 'ping', ts: performance.now() });
  }
}

// ===========================================================================
//  Spielschleife
// ===========================================================================
function updateMe(dt) {
  let ix = input.x, iy = input.y;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) ix -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
  if (keys.has('KeyW') || keys.has('ArrowUp')) iy += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) iy -= 1;
  const mag = Math.hypot(ix, iy);
  if (mag > 1) { ix /= mag; iy /= mag; }
  const strength = Math.min(mag, 1);

  if (strength > 0.01) {
    // Richtung relativ zur Kamera in Weltkoordinaten umrechnen.
    // Der Client bewegt sich sofort (Vorhersage), der Server prüft hinterher.
    const sin = Math.sin(camYaw), cos = Math.cos(camYaw);
    const dx = cos * ix - sin * iy;
    const dz = -sin * ix - cos * iy;
    const lim = RULES.worldHalf;
    me.x = clamp(me.x + dx * RULES.speed * dt, -lim, lim);
    me.z = clamp(me.z + dz * RULES.speed * dt, -lim, lim);
    me.ry = Math.atan2(dx, dz);
  }
  animateCharacter(me.model, me.x, me.z, me.ry, strength * RULES.speed, dt);
}

function updateOthers(dt) {
  // Andere Spieler gleiten weich zu ihrer letzten bekannten Position
  const k = damp(12, dt);
  for (const o of others.values()) {
    const px = o.x, pz = o.z;
    o.x = lerp(o.x, o.tx, k);
    o.z = lerp(o.z, o.tz, k);
    const speed = Math.hypot(o.x - px, o.z - pz) / Math.max(dt, 0.001);
    animateCharacter(o.model, o.x, o.z, o.ry, speed, dt);
  }
}

function updateCamera(dt) {
  tmpV.set(me.x, groundY(me.x, me.z) + 1.5, me.z);
  camTarget.lerp(tmpV, damp(10, dt));
  const horizontal = Math.cos(camPitch) * camDist;
  camera.position.set(
    camTarget.x + Math.sin(camYaw) * horizontal,
    camTarget.y + Math.sin(camPitch) * camDist,
    camTarget.z + Math.cos(camYaw) * horizontal
  );
  const minY = Math.max(heightAt(camera.position.x, camera.position.z), WATER_LEVEL) + 0.8;
  if (camera.position.y < minY) camera.position.y = minY;   // Kamera bleibt über Boden und Wasser
  camera.lookAt(camTarget);
}

const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.1);
  updateMe(dt);
  updateOthers(dt);
  updateCamera(dt);
  updateNet(dt);
  renderer.render(scene, camera);
}

setMe('Du', 0xa8443a);
connect();
frame();
  </script>
</body>
